<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title>Election-Accueil</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="conteneur_haut">
    <div class="titre">
        <h1>
            Cinéma
        </h1>

        <img  alt="Logo du cinema" width="100" />
    </div>
    <div class="zone_droite">
        <div class="menu">
            <div>
                <a
                        >Accueil
                </a>
            </div>
            <div>
                <a
                       >Affichage de tous les films
                </a>
            </div>
            <div>
                <a
                        > Ajouter un film
                </a>
            </div>
            <div>
                <a
                        >Recherche d'un Réalisateur
                </a>
            </div>
        </div>
        <div class="contenu">

            <form  class="mon_formulaire"  method="post"
                  style="max-width: 600px; margin: 0 auto;">
                <div>
                    <label>Titre du film : </label>
                    <input type="text" name="titre"
                           required minlength="3" maxlength="256"/>
                </div>
                <div>
                    <label>Année : </label>
                    <input type="text" name="annee"
                           required minlength="3" maxlength="256"/>
                </div>
                <div>
                    <label>Recettes totales : </label>
                    <input type="text" name="nom_district" 
                           required minlength="3" maxlength="256"/>
                </div>
                <div>
                    <label>Realisateur:</label>
                    <select   class="form-control" required>
					    <option value=""></option>

                    </select>

                </div>
                <div class="text-center">
                    <input type="submit" value="Entregistrer" class="btn btn-primary m-3" />
                    <input type="button" value="Annuler" class="btn btn-secondary" id="buttonCancel" />
                </div>

            </form>
            <p style="text-align:center; color: #2040ee">Entrez le nom du titre, annee, recettes et selectionnez le réalisateur</p>
        </div>
    </div>
</div>
<div class="conteneur_bas">
    <div class="conteneur_bas">
        Examen pratique  pour le cours 420-G26-RO-Applications Web 2, prof: Dini Ahamada
    <a href="https://jigsaw.w3.org/css-validator/#validate_by_upload" target="blank">
        <img  alt="validateur w3c" width="80" />
    </a>
</div>

</body>
</html>
