<body>

        <h1>

        </h1>

        <img alt="Logo du cinema" width="100" />

    <div class="zone_droite">
        <div class="menu">
            <div>
                <a
                       >Accueil
                </a>
            </div>
            <div>
                <a
                       >Affichage de tous les films
                </a>
            </div>
            <div>
                <a

                </a>
            </div>
            <div>

            <form class="mon_formulaire"     method="post">

                    <label>Nom du réalisateur : </label>

                    <input type="text"   required minlength="2" maxlength="45"  />
                </div>
                <input type="submit" value="Chercher le réalisateur" />
            </form>
            <p>Pour afficher un réalisateur : entrez le nom du réalisateur et appuyer sur le bouton</p>
        </div>

    </div>
</div>
